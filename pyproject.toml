[project]
name = "airgap"
version = "0.1.0"
description = "Offline mission reports from drone video on a laptop GPU, and a measurement study of attention kernels and temporal gating"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "huggingface_hub",
    "av",
    "pillow",
    "num2words",
    "matplotlib>=3.11.2",
    "nvidia-ml-py>=13.615.71",
    "pycocoevalcap>=1.2",
]

[tool.uv]
package = false
